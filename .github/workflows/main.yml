name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Ensure stable debug keystore
      run: |
        if [ ! -f debug.keystore ]; then
          echo "debug.keystore not found in repo, generating one (commit this file so future builds reuse the SAME signature!)"
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        else
          echo "Using debug.keystore committed in repo — signing fingerprint stays consistent."
        fi

    - name: Build Debug APK
      env:
        WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
